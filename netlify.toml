[build]
  command = "rm -rf .cache public && npm run build"
  publish = "public"
  functions = "netlify/functions"

  [build.environment]
    NODE_VERSION = "20"

[dev]
  command = "npm run develop"
  targetPort = 8000
  port = 8888
  publish = "public"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/downloads/**"]

[[headers]]
  for = "/.netlify/functions/chat-router"
  [headers.values]
    Cache-Control = "no-store"

# Serve the sitemap index at /sitemap.xml for crawlers that expect it there
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml/sitemap-index.xml"
  status = 200
  force = true
