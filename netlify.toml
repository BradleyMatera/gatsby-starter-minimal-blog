[build]
  command = "rm -rf .cache public && npm run build && node scripts/ping-indexnow.js"
  publish = "public"
  functions = "netlify/functions"

  [build.environment]
    NODE_VERSION = "20"

[dev]
  command = "npm run develop"
  targetPort = 8000
  port = 8888
  publish = "public"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/downloads/**"]

[[headers]]
  for = "/.netlify/functions/chat-router"
  [headers.values]
    Cache-Control = "no-store"

# Allow Bingbot and other crawlers access to all content
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow"

# Serve the sitemap index at /sitemap.xml for crawlers that expect it there
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml/sitemap-index.xml"
  status = 200
  force = true

# IndexNow key for Bing instant indexing
[[headers]]
  for = "/066018fe01b8945f43b635cc715e4f50.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=86400"
