[build]
  command = "rm -rf .cache public .netlify/build-cache && npm run build && node scripts/ping-indexnow.js"
  publish = "public"
  functions = "netlify/functions"

  [build.environment]
    NODE_VERSION = "20"

[dev]
  command = "npm run develop"
  targetPort = 8000
  port = 8888
  publish = "public"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/downloads/**"]

[[headers]]
  for = "/.netlify/functions/chat-router"
  [headers.values]
    Cache-Control = "no-store"

# Allow Bingbot and other crawlers access to all content
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://bradleymatera.github.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.openweathermap.org https://api.stripe.com; media-src 'self'; object-src 'none'; frame-src https://js.stripe.com https://hooks.stripe.com; base-uri 'self'; form-action 'self' https://formspree.io https://checkout.stripe.com; frame-ancestors 'none';"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Serve the sitemap index at /sitemap.xml for crawlers that expect it there
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml/sitemap-index.xml"
  status = 200
  force = true

# Redirect /resources/ to /blog/ (blueprint calls for /resources/ but blog already exists)
[[redirects]]
  from = "/resources"
  to = "/blog/"
  status = 301
  force = true

[[redirects]]
  from = "/resources/*"
  to = "/blog/:splat"
  status = 301
  force = true

# IndexNow key for Bing instant indexing
[[headers]]
  for = "/066018fe01b8945f43b635cc715e4f50.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=86400"

# Noindex transactional and private pages
[[headers]]
  for = "/success"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/success/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/cancel"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/cancel/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/purchases"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/purchases/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
